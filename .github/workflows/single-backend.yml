name: Selected backend consumer
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  consumer:
    # The existing consumer harness needs Docker, including embedded/scaffold lanes.
    runs-on: [self-hosted, beep-vm]
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        backend: [mariadb]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check out immutable public Core anonymously
        env:
          CORE_REF: fc07414dab4b23d3bccc2c1afb6a94a0c31c8d67
          GIT_TERMINAL_PROMPT: '0'
        run: |
          [[ "$CORE_REF" =~ ^[0-9a-f]{40}$ ]] || exit 1
          git init core-source
          git -c credential.helper= -C core-source fetch --no-tags --depth=1 https://github.com/seeken/selecto.git "$CORE_REF"
          git -C core-source checkout --detach FETCH_HEAD
          test "$(git -C core-source rev-parse HEAD)" = "$CORE_REF"
          test -z "$(git -C core-source status --porcelain)"
      - run: SELECTO_CORE_SOURCE=$GITHUB_WORKSPACE/core-source bash ci/single-backend/run "${{ matrix.backend }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: selected-${{ matrix.backend }}
          path: single-backend-evidence
